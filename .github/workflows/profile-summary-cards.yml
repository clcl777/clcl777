name: GitHub Profile Summary Cards

on:
  schedule:
    # Every day at 00:00 UTC (09:00 JST).
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Create this repository secret with a fine-grained PAT that can read
          # the private repositories to include in the aggregate statistics.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 9
          THEME: solarized
          AUTO_PUSH: true

      - name: Update OSS star counts
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        run: python3 .github/scripts/update_oss_stars.py

      - name: Push star count updates
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update OSS star counts"
          git push
